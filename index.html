<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MindPause - Landing Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Google Fonts para um design moderno -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }
        .hero-title {
            font-weight: 700;
            background: linear-gradient(45deg, #6610f2, #6f42c1, #d63384);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .btn-gradient {
            background: linear-gradient(45deg, #6f42c1, #d63384);
            border: none;
            color: white;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            color: white;
            opacity: 0.9;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Seção Principal (Hero) -->
    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center text-center">
                <div class="col-lg-8">
                    <!-- 1) Título chamativo e colorido -->
                    <h1 class="display-4 hero-title mb-4">MindPause</h1>
                    
                    <!-- 2) Breve explicação do produto -->
                    <p class="lead text-muted mb-5">
                         Um assistente digital focado no bem-estar corporativo e no combate ao burnout.
                    </p>
                    
                    <!-- 3) Formulário de contato bonito e centralizado -->
                    <div class="card card-custom p-4 p-md-5 text-start mx-auto" style="max-width: 550px;">
                        <h3 class="h5 mb-4 text-center text-dark fw-bold">Gostou? Entre em contato e saiba mais</h3>
                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label text-secondary small fw-bold">Nome Completo</label>
                                <input type="text" class="form-control form-control-lg bg-light" id="name" placeholder="Digite seu nome" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label text-secondary small fw-bold">E-mail Corporativo</label>
                                <input type="email" class="form-control form-control-lg bg-light" id="email" placeholder="seu@email.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="message" class="form-label text-secondary small fw-bold">Mensagem</label>
                                <textarea class="form-control form-control-lg bg-light" id="message" rows="3" placeholder="Como podemos ajudar?" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-gradient btn-lg w-100 py-3">Enviar Mensagem</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 4) Rodapé escuro -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 text-secondary">Desenvolvido por Heloise Lopes - 2026</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
